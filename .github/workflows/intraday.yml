name: NSE Equity Analyzer

on:
  schedule:
    - cron: "15 3 * * 1-5"   # 08:45 IST
    - cron: "45 3 * * 1-5"   # 09:15 IST
    - cron: "0 7 * * 1-5"    # 12:30 IST
    - cron: "15 10 * * 1-5"  # 15:45 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "Analysis mode"
        required: true
        default: "open"
        type: choice
        options:
          - preopen
          - open
          - midday
          - postmarket

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install yfinance pandas numpy feedparser
      - name: Run market, intraday and investment engines
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          else
            H=$(TZ=Asia/Kolkata date +%H%M)
            if [ "$H" = "0845" ]; then MODE=preopen
            elif [ "$H" = "0915" ]; then MODE=open
            elif [ "$H" = "1230" ]; then MODE=midday
            else MODE=postmarket; fi
          fi
          python intraday_analyzer.py --mode "$MODE"
          python investment_engine.py
          python daily_report.py
      - name: Commit analysis data
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@github.com"
          git add results/
          git diff --staged --quiet || git commit -m "Auto-update equity investment analysis $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
